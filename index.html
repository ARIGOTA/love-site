<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE.exe</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050005;
        font-family: "Courier New", monospace;
    }

    body {
        position: relative;
    }

    /* Неоновый фон */
    .background {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at center,
                rgba(255, 0, 100, 0.16),
                transparent 45%),
            radial-gradient(circle at 20% 80%,
                rgba(255, 20, 80, 0.08),
                transparent 35%),
            #050005;
    }

    /* Консоль */
    .console {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(850px, 90%);
        text-align: center;
        color: #ff4f91;
        text-shadow:
            0 0 5px #ff0055,
            0 0 15px #ff0055,
            0 0 30px rgba(255, 0, 100, 0.7);
        z-index: 10;
        pointer-events: none;
    }

    .title {
        font-size: clamp(45px, 10vw, 100px);
        font-weight: bold;
        letter-spacing: 8px;
        animation: pulse 2s infinite;
    }

    .subtitle {
        margin-top: 15px;
        font-size: clamp(12px, 2vw, 18px);
        opacity: 0.8;
    }

    .terminal {
        margin-top: 25px;
        color: #ff8fba;
        font-size: 13px;
        line-height: 1.8;
        opacity: 0.75;
    }

    .cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        background: #ff4f91;
        animation: blink 0.8s infinite;
    }

    /* Сердца */
    .heart {
        position: fixed;
        bottom: -80px;
        user-select: none;
        pointer-events: none;
        z-index: 5;
        animation:
            fly linear forwards,
            glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes fly {
        0% {
            transform:
                translateY(0)
                translateX(0)
                rotate(0deg)
                scale(0.4);
            opacity: 0;
        }

        10% {
            opacity: 1;
        }

        50% {
            transform:
                translateY(-55vh)
                translateX(var(--move))
                rotate(var(--rotate))
                scale(1);
        }

        100% {
            transform:
                translateY(-120vh)
                translateX(calc(var(--move) * -1))
                rotate(calc(var(--rotate) * 2))
                scale(1.3);
            opacity: 0;
        }
    }

    @keyframes glow {
        from {
            filter:
                drop-shadow(0 0 3px #ff0055);
        }

        to {
            filter:
                drop-shadow(0 0 15px #ff0055)
                drop-shadow(0 0 30px #ff4f91);
        }
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            text-shadow:
                0 0 5px #ff0055,
                0 0 15px #ff0055,
                0 0 30px #ff0055;
        }

        50% {
            transform: scale(1.04);
            text-shadow:
                0 0 10px #ff0055,
                0 0 30px #ff0055,
                0 0 60px #ff4f91;
        }
    }

    @keyframes blink {
        50% {
            opacity: 0;
        }
    }

    /* Сканлайны */
    .scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.015) 0px,
            rgba(255,255,255,0.015) 1px,
            transparent 2px,
            transparent 4px
        );
    }

    /* Мобильная версия */
    max-width: 600px {
        .title {
            letter-spacing: 4px;
        }

        .terminal {
            font-size: 10px;
        }
    }
</style>
</head>

<body>

<div class="background


></div>

<div class="console">
    <div class="title">LOVE.exe</div>

    <div class="subtitle">
        connection established ♥
    </div>

    <div class="terminal">
        &gt; initializing feelings...

        &gt; loading hearts... [████████████] 100%

        &gt; love system activated

        &gt; <span class="cursor"></span>
    </div>
</div>

<div class="scanlines"></div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const nameElement = document.getElementById("name");
const messageElement = document.getElementById("message");
const heartElement = document.getElementById("heart");
const shareButton = document.getElementById("share");

const API_URL =
"https://love-api.myrezerv018.workers.dev";


async function loadPage() {

if (!id) {

nameElement.textContent =
"Страница не найдена";

messageElement.textContent =
"В ссылке отсутствует ID 😢";

return;
}


try {

const response = await fetch(
API_URL +
"/api/page/" +
encodeURIComponent(id)
);


const data =
await response.json();


if (!response.ok) {

throw new Error(
data.error ||
"Page not found"
);

}


nameElement.textContent =
"Для " + data.name;

messageElement.textContent =
data.message;


applyStyle(data.style);

}

catch (error) {

console.error(error);

nameElement.textContent =
"Страница не найдена";

messageElement.textContent =
"Возможно, ссылка неверная или страница была удалена 😢";

heartElement.textContent =
"💔";

}

}


function applyStyle(style) {

if (style === "neon") {

document.body.style.background =
"radial-gradient(circle, #42001f, #080005 70%)";

heartElement.textContent =
"❤️";

nameElement.style.color =
"#ff6fa5";

nameElement.style.textShadow =
"0 0 10px #ff0055, 0 0 25px #ff0055";

}


if (style === "romantic") {

document.body.style.background =
"radial-gradient(circle, #4b1028, #120006 70%)";

heartElement.textContent =
"💗";

nameElement.style.color =
"#ffb0ca";

nameElement.style.textShadow =
"0 0 10px #ff6fa7, 0 0 25px #ff9ac0";

}


if (style === "galaxy") {

document.body.style.background =
"radial-gradient(circle, #35105e, #05000d 70%)";

heartElement.textContent =
"💜";

nameElement.style.color =
"#c98cff";

nameElement.style.textShadow =
"0 0 10px #8d3cff, 0 0 25px #b66cff";

}


if (style === "console") {

document.body.style.background =
"#020802";

document.body.style.color =
"#55ff88";

heartElement.textContent =
"♥";

heartElement.style.filter =
"drop-shadow(0 0 10px #00ff55)";

nameElement.style.color =
"#55ff88";

nameElement.style.textShadow =
"0 0 10px #00ff55";

}

}


/* Летающие сердца */

const hearts = [
"♥",
"♡",
"❤",
"💗",
"💖",
"💕",
"💘"
];


function createHeart() {

const heart =
document.createElement("div");

heart.className =
"heart";

heart.textContent =
hearts[
Math.floor(
Math.random() *
hearts.length
)
];

heart.style.left =
Math.random() * 100 + "vw";

heart.style.fontSize =
15 +
Math.random() * 35 +
"px";

heart.style.setProperty(
"--x",
(
Math.random() * 200 - 100
) + "px"
);

heart.style.animationDuration =
5 +
Math.random() * 6 +
"s";

document.body.appendChild(
heart
);


setTimeout(
() => heart.remove(),
12000
);

}


setInterval(
createHeart,
350
);


/* Поделиться */

shareButton.addEventListener(
"click",
async function () {

const url =
window.location.href;

try {

if (navigator.share) {

await navigator.share({
title: "LOVE.exe ❤️",
url: url
});

return;
}


await navigator.clipboard.writeText(
url
);

this.textContent =
"✓ ССЫЛКА СКОПИРОВАНА";


setTimeout(
() => {

this.textContent =
"♥ ПОДЕЛИТЬСЯ";

},
2000
);

}

catch (error) {

console.error(error);

}

}
);


/* Загружаем страницу */

loadPage();

</script>

</body>
</html>"
