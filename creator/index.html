<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE.exe — Creator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #350018 0%, #0b0007 45%, #020002 100%);
    color: #ff9fc4;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
}

/* Фон */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.015) 0px,
            rgba(255,255,255,0.015) 1px,
            transparent 2px,
            transparent 4px
        );
}

/* Шапка */

.header {
    text-align: center;
    padding: 45px 20px 25px;
}

.logo {
    font-size: clamp(42px, 8vw, 80px);
    font-weight: bold;
    color: #ff4f91;
    letter-spacing: 7px;
    text-shadow:
        0 0 10px #ff0055,
        0 0 25px #ff0055,
        0 0 50px #ff0055;
}

.header p {
    color: #ffb5ce;
    opacity: .75;
}

/* Основная область */

.main {
    width: min(1100px, 94%);
    margin: auto;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;

    padding-bottom: 50px;
}

/* Панели */

.panel {
    border: 1px solid rgba(255, 70, 130, .45);
    border-radius: 18px;
    background: rgba(20, 0, 12, .82);
    box-shadow: 0 0 30px rgba(255, 0, 100, .12);
    padding: 25px;
}

/* Текст */

h2 {
    margin-top: 0;
    color: #ff5c9b;
    text-shadow: 0 0 10px #ff0055;
}

label {
    display: block;
    margin: 20px 0 8px;
}

input,
textarea {
    width: 100%;
    border: 1px solid rgba(255, 70, 130, .45);
    border-radius: 10px;
    padding: 14px;

    background: #090006;
    color: #ffd7e5;

    font-family: "Courier New", monospace;
    font-size: 15px;

    outline: none;
}

input:focus,
textarea:focus {
    border-color: #ff4f91;
    box-shadow: 0 0 15px rgba(255, 0, 100, .3);
}

textarea {
    min-height: 130px;
    resize: vertical;
}

/* Выбор стиля */

.styles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.style {
    padding: 15px;
    border-radius: 10px;

    border: 1px solid rgba(255, 70, 130, .4);
    background: rgba(255, 0, 80, .05);

    color: #ffb0c9;
    cursor: pointer;

    font-family: "Courier New", monospace;
}

.style:hover {
    background: rgba(255, 0, 80, .15);
}

.style.selected {
    background: rgba(255, 0, 80, .22);
    border-color: #ff4f91;
    box-shadow: 0 0 15px rgba(255, 0, 100, .35);
}

/* Кнопка */

#create {
    width: 100%;
    margin-top: 25px;

    padding: 16px;

    border: 0;
    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #ff0055,
        #ff4f91
    );

    color: white;

    font-family: "Courier New", monospace;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 0 25px rgba(255, 0, 100, .3);
}

#create:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(255, 0, 100, .55);
}

/* Предпросмотр */

.preview {
    position: relative;
    min-height: 550px;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    text-align: center;
}

.preview-content {
    position: relative;
    z-index: 5;
    width: 90%;
}

.big-heart {
    font-size: 80px;

    animation: heartbeat 1.5s infinite;

    filter:
        drop-shadow(0 0 10px #ff0055)
        drop-shadow(0 0 25px #ff0055);
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

.preview-name {
    margin-top: 15px;

    font-size: 32px;

    color: #ff5c9b;

    text-shadow:
        0 0 10px #ff0055,
        0 0 25px #ff0055;
}

.preview-message {
    margin-top: 20px;

    color: #ffd7e5;

    line-height: 1.7;

    white-space: pre-wrap;
}

/* Сердца */

.floating-heart {
    position: fixed;
    bottom: -60px;

    pointer-events: none;

    color: #ff4f91;

    text-shadow:
        0 0 8px #ff0055,
        0 0 20px #ff0055;

    animation: fly linear forwards;
}

@keyframes fly {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    to {
        transform:
            translateY(-120vh)
            translateX(var(--x))
            rotate(360deg);

        opacity: 0;
    }
}

/* Мобильная версия */

@media (max-width: 800px) {

    .main {
        grid-template-columns: 1fr;
    }

    .preview {
        min-height: 400px;
    }
}
/* =========================
   SENDER SELECTOR
========================= */

.sender-section {
    position: relative;
    margin-top: 18px;
    margin-bottom: 22px;
}

.sender-title {
    margin-bottom: 8px;
    font-size: 14px;
    opacity: 0.8;
}

.sender-toggle {
    width: 100%;
    min-height: 48px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 16px;

    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;

    color: inherit;
    font: inherit;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.sender-toggle:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255, 255, 255, 0.3);
}

.sender-toggle-arrow {
    font-size: 14px;
    transition: transform 0.2s ease;
}

.sender-section.open .sender-toggle-arrow {
    transform: rotate(180deg);
}

/* выпадающее меню */

.sender-menu {
    display: none;

    margin-top: 8px;
    padding: 8px;

    background: rgba(10, 5, 15, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.45);
}

.sender-section.open .sender-menu {
    display: grid;
    gap: 8px;
}

/* две визуально разделённые кнопки */

.sender-card {
    width: 100%;

    padding: 13px 14px;

    text-align: left;

    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 10px;

    color: inherit;
    font: inherit;

    cursor: pointer;

    transition: 0.2s ease;
}

.sender-card:hover {
    background: rgba(255, 255, 255, 0.07);
    transform: translateY(-1px);
}

.sender-card.active {
    border-color: rgba(255, 80, 160, 0.8);

    background:
        linear-gradient(
            90deg,
            rgba(255, 40, 130, 0.14),
            rgba(140, 60, 255, 0.08)
        );

    box-shadow:
        0 0 18px rgba(255, 40, 130, 0.12);
}

.sender-card-title {
    font-size: 14px;
    font-weight: bold;
}

.sender-card-subtitle {
    margin-top: 4px;
    font-size: 11px;
    opacity: 0.55;
}

/* поле имени */

.sender-name-box {
    display: none;
    margin-top: 12px;
}

.sender-name-box.visible {
    display: block;
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        LOVE.exe
    </div>

    <p>
        &gt; CREATE YOUR OWN LOVE PAGE_
    </p>

</header>


<main class="main">

    <!-- Конструктор -->

    <section class="panel">

        <h2>
            &gt; CONSTRUCTOR
        </h2>

        <label>
            Для кого?
        </label>

        <input
            id="name"
            type="text"
            placeholder="Например: Аня"
            maxlength="40"
        >
<div class="sender-section">

    <div class="sender-title">
        Отправить:
    </div>

    <button
        type="button"
        class="sender-toggle"
        id="senderToggle"
    >
        <span id="senderToggleText">
            Анонимно
        </span>

        <span class="sender-toggle-arrow">
            ▾
        </span>
    </button>

    <div
        class="sender-menu"
        id="senderMenu"
    >

        <button
            type="button"
            class="sender-card active"
            data-mode="anonymous"
        >
            <div class="sender-card-title">
                👤 Анонимно
            </div>

            <div class="sender-card-subtitle">
                На странице будет «От Анонима»
            </div>
        </button>

        <button
            type="button"
            class="sender-card"
            data-mode="named"
        >
            <div class="sender-card-title">
                ❤️ От своего имени
            </div>

            <div class="sender-card-subtitle">
                Указать своё имя
            </div>
        </button>

    </div>

    <div
        class="sender-name-box"
        id="senderNameBox"
    >
        <label>
            Ваше имя
        </label>

        <input
            id="sender"
            type="text"
            placeholder="Например: Егор"
            maxlength="40"
            autocomplete="off"
        >
    </div>

</div>

        <label>
            Твоё сообщение
        </label>

        <textarea
            id="message"
            placeholder="Напиши что-нибудь от сердца..."
            maxlength="500"
        ></textarea>


        <label>
            Выбери стиль
        </label>

        <div class="styles">

            <button
                class="style selected"
                data-style="neon"
            >
                ❤️ NEON
            </button>

            <button
                class="style"
                data-style="romantic"
            >
                💕 ROMANTIC
            </button>

            <button
                class="style"
                data-style="galaxy"
            >
                🌌 GALAXY
            </button>

            <button
                class="style"
                data-style="console"
            >
                💻 CONSOLE
            </button>

        </div>


        <button id="create">
            ♥ СОЗДАТЬ СТРАНИЦУ ♥
        </button>

    </section>


    <!-- Предпросмотр -->

    <section class="panel preview">

        <div class="preview-content">

            <div class="big-heart">
                ❤️
            </div>

            <div
                class="preview-name"
                id="previewName"
            >
                Твоё имя
            </div>

            <div
                class="preview-message"
                id="previewMessage"
            >
                Здесь появится твоё сообщение...
            </div>

        </div>

    </section>

</main>


<script>

const nameInput = document.getElementById("name");

const senderInput =
    document.getElementById("sender");

const senderSection =
    document.querySelector(".sender-section");

const senderToggle =
    document.getElementById("senderToggle");

const senderToggleText =
    document.getElementById("senderToggleText");

const senderMenu =
    document.getElementById("senderMenu");

const senderNameBox =
    document.getElementById("senderNameBox");

const senderCards =
    document.querySelectorAll(".sender-card");

let senderMode = "anonymous";

const messageInput =
    document.getElementById("message");

senderToggle.addEventListener("click", function () {
    senderSection.classList.toggle("open");
});

senderCards.forEach(function (card) {

    card.addEventListener("click", function () {

        senderCards.forEach(function (item) {
            item.classList.remove("active");
        });

        this.classList.add("active");

        senderMode = this.dataset.mode;

        if (senderMode === "anonymous") {

            senderToggleText.textContent = "Анонимно";
            senderNameBox.classList.remove("visible");
            senderInput.value = "";

        } else {

            senderToggleText.textContent = "От своего имени";
            senderNameBox.classList.add("visible");
            senderInput.focus();

        }

        senderSection.classList.remove("open");
    });

});

/* Живой предпросмотр сообщения */

messageInput.addEventListener("input", function () {

previewMessage.textContent =
this.value ||
"Здесь появится твоё сообщение...";

});


/* Смена стиля */

styles.forEach(function (button) {

button.addEventListener("click", function () {

/* Снимаем выделение */

styles.forEach(function (item) {
item.classList.remove("selected");
});

/* Выделяем выбранный */

this.classList.add("selected");

/* Получаем название стиля */

const selectedStyle =
this.dataset.style;

applyStyle(selectedStyle);

});

});


/* Применение стиля */

function applyStyle(style) {

if (style === "neon") {

preview.style.background =
"radial-gradient(circle, #42001f, #090006 70%)";

preview.style.color = "#ff4f91";

bigHeart.textContent = "❤️";

bigHeart.style.filter =
"drop-shadow(0 0 10px #ff0055) drop-shadow(0 0 30px #ff0055)";

previewName.style.color =
"#ff5c9b";

previewName.style.textShadow =
"0 0 10px #ff0055, 0 0 25px #ff0055";

}


if (style === "romantic") {

preview.style.background =
"radial-gradient(circle, #4b1028, #18000d 70%)";

preview.style.color = "#ffb6d0";

bigHeart.textContent = "💗";

bigHeart.style.filter =
"drop-shadow(0 0 10px #ff6fa7) drop-shadow(0 0 35px #ff9ac0)";

previewName.style.color =
"#ffb0ca";

previewName.style.textShadow =
"0 0 10px #ff6fa7, 0 0 25px #ff9ac0";

}


if (style === "galaxy") {

preview.style.background =
"radial-gradient(circle at 50% 40%, #35105e, #080014 70%)";

preview.style.color = "#d8a8ff";

bigHeart.textContent = "💜";

bigHeart.style.filter =
"drop-shadow(0 0 10px #9b4dff) drop-shadow(0 0 35px #b66cff)";

previewName.style.color =
"#c98cff";

previewName.style.textShadow =
"0 0 10px #8d3cff, 0 0 25px #b66cff";

}


if (style === "console") {

preview.style.background =
"#020802";

preview.style.color = "#55ff88";

bigHeart.textContent = "♥";

bigHeart.style.filter =
"drop-shadow(0 0 8px #00ff55)";

previewName.style.color =
"#55ff88";

previewName.style.textShadow =
"0 0 10px #00ff55";

}

}


/* Создание страницы */

createButton.addEventListener("click", async function () {
function resetCreateButton() {
    createButton.disabled = false;
    createButton.textContent = "♥ СОЗДАТЬ СТРАНИЦУ ♥";
}

/* Срабатывает, когда пользователь возвращается назад */
window.addEventListener("pageshow", function () {
    resetCreateButton();
});
const name =
    nameInput.value.trim();

const sender =
    senderMode === "anonymous"
        ? "anonymous"
        : senderInput.value.trim();

const message =
    messageInput.value.trim();

const selectedStyle =
document
.querySelector(".style.selected")
.dataset.style;


if (!name) {
alert("Сначала введи имя ❤️");
nameInput.focus();
return;
}

if (!message) {
alert("Сначала напиши сообщение ❤️");
messageInput.focus();
return;
}

if (
    senderMode === "named" &&
    !sender
) {
    alert("Введите своё имя ❤️");
    senderInput.focus();
    return;
}

createButton.disabled = true;
createButton.textContent =
"СОЗДАЁМ СТРАНИЦУ...";


try {

const response = await fetch(
"https://love-api.myrezerv018.workers.dev/api/create",
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
name: name,
sender: sender,
message: message,
style: selectedStyle
})
}
);


const data =
await response.json();


if (!response.ok) {

throw new Error(
data.error ||
"Не удалось создать страницу"
);

}


const pageUrl =
"../page/?id=" +
encodeURIComponent(data.id);


window.location.href =
pageUrl;

}

catch (error) {

console.error(error);

alert(
"Не удалось создать страницу 😢\n\n" +
"Попробуй ещё раз."
);

createButton.disabled = false;

createButton.textContent =
"♥ СОЗДАТЬ СТРАНИЦУ ♥";

}

});


/* Плавающие сердца */

const heartTypes = [
"♥",
"♡",
"❤",
"💗",
"💖",
"💕",
"💘"
];

function createHeart() {

const heart =
document.createElement("div");

heart.className =
"floating-heart";

heart.textContent =
heartTypes[
Math.floor(
Math.random() *
heartTypes.length
)
];

heart.style.left =
Math.random() * 100 + "vw";

heart.style.fontSize =
15 + Math.random() * 35 + "px";

heart.style.setProperty(
"--x",
(Math.random() * 200 - 100) + "px"
);

heart.style.animationDuration =
5 + Math.random() * 6 + "s";

document.body.appendChild(heart);

setTimeout(function () {
heart.remove();
}, 12000);

}

setInterval(createHeart, 400);


/* Стиль по умолчанию */

applyStyle("neon");

</script>

</body>
</html>
