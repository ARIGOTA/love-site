<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOVE.exe — Создай свою страницу</title>

<style>

* {
box-sizing: border-box;
}

html, body {
margin: 0;
min-height: 100%;
}

body {
background:
radial-gradient(circle at 20% 20%, rgba(255, 0, 100, .15), transparent 30%),
radial-gradient(circle at 80% 80%, rgba(255, 40, 120, .12), transparent 30%),
#050005;

color: #ff8fb9;

font-family:
"Courier New",
monospace;

min-height: 100vh;
padding: 30px;
}

/* Фоновые сердца */

.heart {
position: fixed;
pointer-events: none;
color: #ff3f88;
opacity: .15;
animation: float 8s linear infinite;
}

@keyframes float {

from {
transform:
translateY(110vh)
rotate(0deg);
}

to {
transform:
translateY(-20vh)
rotate(360deg);
}

}

/* Основной контейнер */

.container {

width: min(1100px, 100%);

margin: auto;

display: grid;

grid-template-columns:
1fr 1fr;

gap: 25px;
}

/* Панели */

.panel {

border:
1px solid rgba(255, 60, 130, .5);

border-radius: 15px;

padding: 25px;

background:
rgba(20, 0, 12, .75);

box-shadow:
0 0 25px rgba(255, 0, 100, .12);

backdrop-filter:
blur(10px);
}

/* Заголовок */

.logo {

text-align: center;

font-size: clamp(
35px,
6vw,
65px
);

font-weight: bold;

letter-spacing: 5px;

color: #ff4f91;

text-shadow:
0 0 10px #ff0055,
0 0 30px #ff0055;

margin-bottom: 10px;
}

.description {

text-align: center;

opacity: .7;

margin-bottom: 30px;
}

/* Заголовки */

h2 {

color: #ff4f91;

text-shadow:
0 0 10px #ff0055;
}

/* Поля */

label {

display: block;

margin-top: 20px;

margin-bottom: 8px;

color: #ff8fb9;
}

input,
textarea,
select {

width: 100%;

padding: 13px;

border-radius: 8px;

border:
1px solid rgba(255, 80, 140, .5);

background:
rgba(0, 0, 0, .5);

color: #ffd0df;

font-family:
"Courier New",
monospace;

outline: none;

transition: .2s;
}

textarea {

min-height: 130px;

resize: vertical;
}

input:focus,
textarea:focus,
select:focus {

border-color:
#ff4f91;

box-shadow:
0 0 15px
rgba(255, 0, 100, .3);
}

/* Стили */

.styles {

display: grid;

grid-template-columns:
repeat(2, 1fr);

gap: 10px;

margin-top: 10px;
}

.style-button {

padding: 15px;

border-radius: 10px;

border:
1px solid
rgba(255, 70, 130, .4);

background:
rgba(255, 0, 80, .05);

color: #ff9fc0;

cursor: pointer;

font-family:
"Courier New",
monospace;

transition: .2s;
}

.style-button:hover {

transform:
translateY(-2px);

background:
rgba(255, 0, 80, .12);
}

.style-button.active {

border-color:
#ff4f91;

background:
rgba(255, 0, 100, .18);

box-shadow:
0 0 15px
rgba(255, 0, 100, .3);
}

/* Кнопка */

.create-button {

width: 100%;

margin-top: 25px;

padding: 16px;

border: none;

border-radius: 10px;

background:
linear-gradient(
90deg,
#ff0055,
#ff3f88
);

color: white;

font-family:
"Courier New",
monospace;

font-size: 16px;

font-weight: bold;

cursor: pointer;

box-shadow:
0 0 20px
rgba(255, 0, 100, .35);

transition: .2s;
}

.create-button:hover {

transform:
translateY(-2px);

box-shadow:
0 0 35px
rgba(255, 0, 100, .55);
}

/* Предпросмотр */

.preview {

min-height: 550px;

display: flex;

align-items: center;

justify-content: center;

text-align: center;

position: relative;

overflow: hidden;
}

.preview-content {

position: relative;

z-index: 2;

max-width: 90%;
}

.preview-heart {

font-size: 70px;

animation:
heartbeat 1.5s
infinite;
}

@keyframes heartbeat {

0%, 100% {
transform: scale(1);
}

50% {
transform: scale(1.15);
}

}

.preview-name {

font-size: 35px;

color: #ff5b9a;

margin-top: 15px;

text-shadow:
0 0 15px #ff0055;
}

.preview-message {

margin-top: 20px;

line-height: 1.7;

white-space: pre-wrap;

color: #ffd0df;
}

/* Адаптация */

@media (max-width: 800px) {

body {
padding: 15px;
}

.container {

grid-template-columns:
1fr;

}

.preview {

min-height: 400px;

}

}

</style>
</head>

<body>

<!-- Фоновые сердца -->

<script>

for (let i = 0; i < 15; i++) {

const heart =
document.createElement("div");

heart.className = "heart";

heart.textContent =
["♥", "♡", "❤", "💗", "💖"]
[Math.floor(Math.random() * 5)];

heart.style.left =
Math.random() * 100 + "%";

heart.style.fontSize =
(15 + Math.random() * 30) + "px";

heart.style.animationDuration =
(5 + Math.random() * 8) + "s";

heart.style.animationDelay =
Math.random() * 8 + "s";

document.body.appendChild(heart);

}

</script>


<div class="container">

<!-- КОНСТРУКТОР -->

<div class="panel">

<div class="logo">
LOVE.exe
</div>

<div class="description">
Создай свою маленькую историю ❤️
</div>

<h2>
&gt; CREATE_LOVE
</h2>


<label>
Для кого?
</label>

<input
id="nameInput"
type="text"
placeholder="Например: Аня"
>


<label>
Сообщение
</label>

<textarea
id="messageInput"
placeholder="Напиши что-нибудь от сердца..."
></textarea>


<label>
Выбери стиль
</label>

<div class="styles">

<button
class="style-button active"
data-style="neon"
>
❤️ Neon
</button>

<button
class="style-button"
data-style="romantic"
>
💕 Romantic
</button>

<button
class="style-button"
data-style="galaxy"
>
🌌 Galaxy
</button>

<button
class="style-button"
data-style="console"
>
💻 Console
</button>

</div>


<button
class="create-button"
id="createButton"
>
♥ СОЗДАТЬ СТРАНИЦУ ♥
</button>

</div>


<!-- ПРЕДПРОСМОТР -->

<div class="panel preview">

<div class="preview-content">

<div class="preview-heart">
❤️
</div>

<div
class="preview-name"
id="previewName"
>
Твоё имя
</div>

<div
class="preview-message"
id="previewMessage"
>
Здесь появится твоё сообщение...
</div>

</div>

</div>

</div>


<script>

/* Получаем элементы */

const nameInput =
document.getElementById(
"nameInput"
);

const messageInput =
document.getElementById(
"messageInput"
);

const previewName =
document.getElementById(
"previewName"
);

const previewMessage =
document.getElementById(
"previewMessage"
);


/* Живой предпросмотр */

nameInput.addEventListener(
"input",
() => {

previewName.textContent =
nameInput.value ||
"Твоё имя";

}
);


messageInput.addEventListener(
"input",
() => {

previewMessage.textContent =
messageInput.value ||
"Здесь появится твоё сообщение...";

}
);


/* Выбор стиля */

const styleButtons =
document.querySelectorAll(
".style-button"
);

styleButtons.forEach(button => {

button.addEventListener(
"click",
() => {

styleButtons.forEach(
b =>
b.classList.remove(
"active"
)
);

button.classList.add(
"active"
);

}
);

});


/* Создание */

document
.getElementById("createButton")
.addEventListener(
"click",
() => {

const name =
nameInput.value.trim();

const message =
messageInput.value.trim();

if (!name) {

alert(
"Введите имя ❤️"
);

return;

}

if (!message) {

alert(
"Напишите сообщение ❤️"
);

return;

}

alert(
"Конструктор работает! ❤️\n\n" +
"Следующим этапом мы сделаем " +
"настоящую уникальную ссылку."
);

}
);

</script>

</body>
</html>
