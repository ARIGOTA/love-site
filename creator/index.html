<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE.exe — Creator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #350018 0%, #0b0007 45%, #020002 100%);
    color: #ff9fc4;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
}

/* Фон */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.015) 0px,
            rgba(255,255,255,0.015) 1px,
            transparent 2px,
            transparent 4px
        );
}

/* Шапка */

.header {
    text-align: center;
    padding: 45px 20px 25px;
}

.logo {
    font-size: clamp(42px, 8vw, 80px);
    font-weight: bold;
    color: #ff4f91;
    letter-spacing: 7px;
    text-shadow:
        0 0 10px #ff0055,
        0 0 25px #ff0055,
        0 0 50px #ff0055;
}

.header p {
    color: #ffb5ce;
    opacity: .75;
}

/* Основная область */

.main {
    width: min(1100px, 94%);
    margin: auto;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;

    padding-bottom: 50px;
}

/* Панели */

.panel {
    border: 1px solid rgba(255, 70, 130, .45);
    border-radius: 18px;
    background: rgba(20, 0, 12, .82);
    box-shadow: 0 0 30px rgba(255, 0, 100, .12);
    padding: 25px;
}

/* Текст */

h2 {
    margin-top: 0;
    color: #ff5c9b;
    text-shadow: 0 0 10px #ff0055;
}

label {
    display: block;
    margin: 20px 0 8px;
}

input,
textarea {
    width: 100%;
    border: 1px solid rgba(255, 70, 130, .45);
    border-radius: 10px;
    padding: 14px;

    background: #090006;
    color: #ffd7e5;

    font-family: "Courier New", monospace;
    font-size: 15px;

    outline: none;
}

input:focus,
textarea:focus {
    border-color: #ff4f91;
    box-shadow: 0 0 15px rgba(255, 0, 100, .3);
}

textarea {
    min-height: 130px;
    resize: vertical;
}

/* Выбор стиля */

.styles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.style {
    padding: 15px;
    border-radius: 10px;

    border: 1px solid rgba(255, 70, 130, .4);
    background: rgba(255, 0, 80, .05);

    color: #ffb0c9;
    cursor: pointer;

    font-family: "Courier New", monospace;
}

.style:hover {
    background: rgba(255, 0, 80, .15);
}

.style.selected {
    background: rgba(255, 0, 80, .22);
    border-color: #ff4f91;
    box-shadow: 0 0 15px rgba(255, 0, 100, .35);
}

/* Кнопка */

#create {
    width: 100%;
    margin-top: 25px;

    padding: 16px;

    border: 0;
    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #ff0055,
        #ff4f91
    );

    color: white;

    font-family: "Courier New", monospace;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 0 25px rgba(255, 0, 100, .3);
}

#create:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(255, 0, 100, .55);
}

/* Предпросмотр */

.preview {
    position: relative;
    min-height: 550px;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    text-align: center;
}

.preview-content {
    position: relative;
    z-index: 5;
    width: 90%;
}

.big-heart {
    font-size: 80px;

    animation: heartbeat 1.5s infinite;

    filter:
        drop-shadow(0 0 10px #ff0055)
        drop-shadow(0 0 25px #ff0055);
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

.preview-name {
    margin-top: 15px;

    font-size: 32px;

    color: #ff5c9b;

    text-shadow:
        0 0 10px #ff0055,
        0 0 25px #ff0055;
}

.preview-message {
    margin-top: 20px;

    color: #ffd7e5;

    line-height: 1.7;

    white-space: pre-wrap;
}

/* Сердца */

.floating-heart {
    position: fixed;
    bottom: -60px;

    pointer-events: none;

    color: #ff4f91;

    text-shadow:
        0 0 8px #ff0055,
        0 0 20px #ff0055;

    animation: fly linear forwards;
}

@keyframes fly {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    to {
        transform:
            translateY(-120vh)
            translateX(var(--x))
            rotate(360deg);

        opacity: 0;
    }
}

/* Мобильная версия */

@media (max-width: 800px) {

    .main {
        grid-template-columns: 1fr;
    }

    .preview {
        min-height: 400px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        LOVE.exe
    </div>

    <p>
        &gt; CREATE YOUR OWN LOVE PAGE_
    </p>

</header>


<main class="main">

    <!-- Конструктор -->

    <section class="panel">

        <h2>
            &gt; CONSTRUCTOR
        </h2>

        <label>
            Имя получателя
        </label>

        <input
            id="name"
            type="text"
            placeholder="Например: Аня"
            maxlength="40"
        >


        <label>
            Твоё сообщение
        </label>

        <textarea
            id="message"
            placeholder="Напиши что-нибудь от сердца..."
            maxlength="500"
        ></textarea>


        <label>
            Выбери стиль
        </label>

        <div class="styles">

            <button
                class="style selected"
                data-style="neon"
            >
                ❤️ NEON
            </button>

            <button
                class="style"
                data-style="romantic"
            >
                💕 ROMANTIC
            </button>

            <button
                class="style"
                data-style="galaxy"
            >
                🌌 GALAXY
            </button>

            <button
                class="style"
                data-style="console"
            >
                💻 CONSOLE
            </button>

        </div>


        <button id="create">
            ♥ СОЗДАТЬ СТРАНИЦУ ♥
        </button>

    </section>


    <!-- Предпросмотр -->

    <section class="panel preview">

        <div class="preview-content">

            <div class="big-heart">
                ❤️
            </div>

            <div
                class="preview-name"
                id="previewName"
            >
                Твоё имя
            </div>

            <div
                class="preview-message"
                id="previewMessage"
            >
                Здесь появится твоё сообщение...
            </div>

        </div>

    </section>

</main>


<script>

/* Получаем элементы */

const nameInput =
    document.getElementById("name");

const messageInput =
    document.getElementById("message");

const previewName =
    document.getElementById("previewName");

const previewMessage =
    document.getElementById("previewMessage");

const createButton =
    document.getElementById("create");


/* Живой предпросмотр */

nameInput.addEventListener("input", function() {

    previewName.textContent =
        this.value || "Твоё имя";

});


messageInput.addEventListener("input", function() {

    previewMessage.textContent =
        this.value ||
        "Здесь появится твоё сообщение...";

});


/* Выбор стиля */

const styles =
    document.querySelectorAll(".style");

styles.forEach(function(button) {

    button.addEventListener("click", function() {

        styles.forEach(function(item) {

            item.classList.remove("selected");

        });

        this.classList.add("selected");

    });

});


/* Кнопка */

createButton.addEventListener("click", function() {

    const name =
        nameInput.value.trim();

    const message =
        messageInput.value.trim();

    if (!name) {

        alert("Сначала введи имя ❤️");

        nameInput.focus();

        return;
    }

    if (!message) {

        alert("Сначала напиши сообщение ❤️");

        messageInput.focus();

        return;
    }

    alert(
        "Отлично! ❤️\n\n" +
        "Твоя страница готова к созданию.\n\n" +
        "Следующим этапом мы подключим " +
        "уникальные ссылки."
    );

});


/* Анимация сердечек */

const heartTypes = [
    "♥",
    "♡",
    "❤",
    "💗",
    "💖",
    "💕",
    "💘"
];

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    heart.textContent =
        heartTypes[
            Math.floor(
                Math.random() *
                heartTypes.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        15 + Math.random() * 35 + "px";

    heart.style.setProperty(
        "--x",
        (Math.random() * 200 - 100) + "px"
    );

    heart.style.animationDuration =
        5 + Math.random() * 6 + "s";

    document.body.appendChild(heart);

    setTimeout(function() {

        heart.remove();

    }, 12000);
}


setInterval(createHeart, 400);

</script>

</body>
</html>
