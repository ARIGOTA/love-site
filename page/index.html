/* =========================
ЗАГРУЗКА СТРАНИЦЫ
========================= */
function declineName(name) {

if (!name) return name;

const original = name.trim();
const lower = original.toLowerCase();

let result = original;


// Исключения и особые имена

const exceptions = {
"любовь": "Любови",
"мария": "Марии",
"софия": "Софии",
"лилия": "Лилии",
"юлия": "Юлии",
"наталия": "Наталии",
"валерия": "Валерии",
"виктория": "Виктории",
"анастасия": "Анастасии",
"ксения": "Ксении",
"евгения": "Евгении",
"дарья": "Дарьи",
"наталья": "Натальи",
"татьяна": "Татьяны",
"полина": "Полины",
"алина": "Алины",
"анна": "Анны",
"елена": "Елены",
"ольга": "Ольги",
"ирина": "Ирины",
"екатерина": "Екатерины",
"александра": "Александры",
"вероника": "Вероники",
"карина": "Карины",

"илья": "Ильи",
"никита": "Никиты",
"данила": "Данилы",
"данил": "Данила",
"павел": "Павла",
"лев": "Льва"
};


if (exceptions[lower]) {
return matchCase(
original,
exceptions[lower]
);
}


// Женские имена на -ия:
// Мария -> Марии

if (lower.endsWith("ия")) {

result =
original.slice(0, -2) +
"ии";

}

// Женские имена на -ья:
// Дарья -> Дарьи

else if (lower.endsWith("ья")) {

result =
original.slice(0, -2) +
"ьи";

}

// Большинство имён на -а:
// Полина -> Полины
// Анна -> Анны

else if (lower.endsWith("а")) {

const beforeA =
lower.charAt(
lower.length - 2
);

// После г, к, х, ж, ч, ш, щ
// пишется И

if (
"гкхжчшщ".includes(beforeA)
) {

result =
original.slice(0, -1) +
"и";

}

else {

result =
original.slice(0, -1) +
"ы";

}

}

// Имена на -я:
// Илья -> Ильи

else if (lower.endsWith("я")) {

result =
original.slice(0, -1) +
"и";

}

// Мужские имена на согласную:
// Максим -> Максима
// Артём -> Артёма

else if (
/[бвгджзйклмнпрстфхцчшщ]$/i
.test(lower)
) {

result =
original + "а";

}


return result;
}


function matchCase(original, declined) {

if (
original ===
original.toUpperCase()
) {

return declined.toUpperCase();

}


if (
original[0] ===
original[0].toUpperCase()
) {

return (
declined[0].toUpperCase() +
declined.slice(1)
);

}


return declined.toLowerCase();
}
function declineSenderName(name) {
    if (!name) return name;

    const original = name.trim();
    const lower = original.toLowerCase();

    const exceptions = {
        "любовь": "Любови",
        "мария": "Марии",
        "софия": "Софии",
        "лилия": "Лилии",
        "юлия": "Юлии",
        "наталия": "Наталии",
        "валерия": "Валерии",
        "виктория": "Виктории",
        "анастасия": "Анастасии",
        "ксения": "Ксении",
        "евгения": "Евгении",
        "дарья": "Дарьи",
        "наталья": "Натальи",
        "татьяна": "Татьяны",
        "полина": "Полины",
        "алина": "Алины",
        "анна": "Анны",
        "елена": "Елены",
        "ольга": "Ольги",
        "ирина": "Ирины",
        "екатерина": "Екатерины",
        "александра": "Александры",
        "вероника": "Вероники",
        "карина": "Карины",
        "илья": "Ильи",
        "никита": "Никиты",
        "данила": "Данилы",
        "данил": "Данила"
    };

    if (exceptions[lower]) {
        return exceptions[lower];
    }

    let declined = original;

    if (lower.endsWith("а")) {
        declined = original.slice(0, -1) + "ы";
    } else if (lower.endsWith("я")) {
        declined = original.slice(0, -1) + "и";
    } else if (lower.endsWith("й")) {
        declined = original.slice(0, -1) + "я";
    } else if (lower.endsWith("ь")) {
        declined = original.slice(0, -1) + "я";
    } else if (/[бвгджзклмнпрстфхцчшщ]$/i.test(lower)) {
        declined = original + "а";
    }

    return declined;
}
async function loadPage() {

if (!id) {

showError(
"Страница не найдена",
"В ссылке отсутствует ID 😢"
);

return;
}


try {

statusElement.textContent =
"> loading page " +
id.toUpperCase() +
"...";


const response =
await fetch(
API_URL +
"/api/page/" +
encodeURIComponent(
id
)
);


const data =
await response.json();


if (!response.ok) {

throw new Error(
data.error ||
"Page not found"
);

}


nameElement.textContent =
    "Для " + declineName(data.name);


messageElement.textContent =
data.message;

if (data.sender === "anonymous") {

    senderElement.textContent =
        "От Анонима";

} else if (data.sender) {

    senderElement.textContent =
        "От " + declineSenderName(data.sender);

} else {

    senderElement.textContent = "";

}

currentStyle =
data.style ||
"neon";


applyStyle(
currentStyle
);


statusElement.textContent =
"> LOVE connection established ♥";


document.title =
"LOVE.exe — Для " +
data.name;


}

catch (error) {

console.error(
"LOAD ERROR:",
error
);


showError(
"Страница не найдена",
"Не удалось загрузить данные 😢"
);

}

}

/* =========================
ПОДЕЛИТЬСЯ
========================= */

shareButton.addEventListener(
    "click",

    async function () {

        const url =
            window.location.href;

        const isMobile =
            /Android|iPhone|iPad|iPod/i.test(
                navigator.userAgent
            );

        try {

            /* На телефоне открываем системное меню */

            if (
                isMobile &&
                navigator.share
            ) {

                await navigator.share({
                    title: "LOVE.exe ❤️",
                    text: "Для тебя есть кое-что особенное ❤️",
                    url: url
                });

                return;
            }

            /* На компьютере просто копируем ссылку */

            await navigator.clipboard.writeText(
                url
            );

            this.textContent =
                "✓ ССЫЛКА СКОПИРОВАНА";

            setTimeout(() => {

                this.textContent =
                    "♥ ПОДЕЛИТЬСЯ";

            }, 2000);

        }

        catch (error) {

            console.error(
                "SHARE ERROR:",
                error
            );

            prompt(
                "Скопируй ссылку:",
                url
            );

        }

    }
);

"#00ff66";

qrPanel.style.boxShadow =
"0 0 30px rgba(0, 255, 90, .35)";

qrPanel.style.background =
"rgba(0, 16, 5, .95)";

title.style.color =
"#55ff88";

title.textContent =
"> QR_LINK_READY_";

}

else {

qrPanel.style.borderColor =
"#ff4f91";

qrPanel.style.boxShadow =
"0 0 40px rgba(255, 0, 100, .5)";

qrPanel.style.background =
"rgba(20, 0, 9, .95)";

title.style.color =
"#ff9fc4";

title.textContent =
"❤️ LOVE.exe QR";

}
}


function generateQR() {

qrCodeElement.innerHTML = "";

const colors =
getQRColors();


new QRCode(
qrCodeElement,
{
text: window.location.href,

width: 220,
height: 220,

colorDark:
colors.dark,

colorLight:
colors.light,

correctLevel:
QRCode.CorrectLevel.H
}
);


qrGenerated = true;

styleQRPanel();

}


qrButton.addEventListener(
"click",

function () {

if (!qrGenerated) {
generateQR();
}


if (
qrPanel.style.display ===
"block"
) {

qrPanel.style.display =
"none";

qrButton.textContent =
"▦ QR-КОД";

}

else {

qrPanel.style.display =
"block";

qrButton.textContent =
"× СКРЫТЬ QR";

}

}
);downloadQRButton.addEventListener(
"click",

function () {

const canvas =
qrCodeElement.querySelector("canvas");

const image =
qrCodeElement.querySelector("img");

let dataURL;


if (canvas) {

dataURL =
canvas.toDataURL("image/png");

}

else if (image) {

dataURL =
image.src;

}

else {

return;

}


const link =
document.createElement("a");


link.href =
dataURL;


link.download =
"LOVE-" +
(id || "QR") +
".png";


link.click();

}
);copyLinkButton.addEventListener(
    "click",

    async function () {

        try {

            await navigator
                .clipboard
                .writeText(
                    window.location.href
                );

            this.textContent =
                "✓ СКОПИРОВАНО";

            setTimeout(
                () => {

                    this.textContent =
                        "⧉ СКОПИРОВАТЬ ССЫЛКУ";

                },
                2000
            );

        }

        catch {

            prompt(
                "Скопируй ссылку:",
                window.location.href
            );

        }

    }
);

/* =========================
START
========================= */

loadPage();

</script>
